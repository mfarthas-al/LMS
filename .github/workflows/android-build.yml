# Manual Android build via Expo EAS. Requires the EXPO_TOKEN repository secret.
name: Android build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [preview, production]
        default: preview

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@lms/shared --filter=@lms/api-client
      - working-directory: apps/mobile
        run: eas build --platform android --profile ${{ inputs.profile }} --non-interactive --no-wait
