# Runs on every push and pull request: install, typecheck, lint, test, build.
# Deployment workflows will be added once hosting is decided (see docs/deployment.md).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lms
          POSTGRES_PASSWORD: lms_ci_password
          POSTGRES_DB: lms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lms" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://lms:lms_ci_password@localhost:5432/lms_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci_only_access_secret_ci_only_access_secret_00
      JWT_REFRESH_SECRET: ci_only_refresh_secret_ci_only_refresh_secret_0
      VIDEO_TOKEN_SECRET: ci_only_video_secret_ci_only_video_secret_0000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lms/api prisma:generate
      - run: pnpm --filter @lms/api prisma:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on known high/critical vulnerabilities in dependencies.
      - run: pnpm audit --audit-level=high
      # Scans the repo for accidentally committed secrets.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
